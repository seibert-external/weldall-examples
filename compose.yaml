# Docker Compose 2.17+ / BuildKit: additional_contexts is used by bootstrap.
# Pinned to Weldall 0.7.3 (tag @weldall/weldall@0.7.3): native MCP and MCP Apps,
# schema migrations up to 0021. The server applies migrations on start.
x-weldall-source: &weldall-source https://github.com/seibert-external/weldall.git#64b3de458808956b7defd30b4a4a66d31a263577
x-database-url: &database-url postgresql://weldall:${POSTGRES_PASSWORD:?Run npm run generate-env}@postgres:5432/weldall
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?Run npm run generate-env}@redis:6379/0

services:
  postgres:
    image: postgres:16.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: weldall
      POSTGRES_USER: weldall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weldall -d weldall"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.8-bookworm
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    # Always fsync accepted proofs. Eviction or lost AOF would allow replay.
    command:
      [
        sh,
        -ec,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync always --maxmemory 128mb --maxmemory-policy noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  weldall:
    build:
      context: *weldall-source
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: *database-url
      WELDALL_DEPLOYMENT_MODE: production
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Required}
      # Authorizes the one-time /setup wizard; login providers are database rows, not env vars.
      WELDALL_SETUP_TOKEN: ${WELDALL_SETUP_TOKEN:?Required}
      WELDALL_SIGNING_PRIVATE_JWK: ${WELDALL_SIGNING_PRIVATE_JWK:?Required}
      WELDALL_SIGNING_PUBLIC_JWK: ${WELDALL_SIGNING_PUBLIC_JWK:?Required}
      WELDALL_SIGNING_KID: ${WELDALL_SIGNING_KID:?Required}
      WELDALL_CREDENTIAL_ENCRYPTION_KEY: ${WELDALL_CREDENTIAL_ENCRYPTION_KEY:?Required}
      WELDALL_CONNECTOR_KEK: ${WELDALL_CONNECTOR_KEK:?Required}
      LOG_LEVEL: INFO
    expose: ["3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/.well-known/openid-configuration').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  contracts:
    build: &node-build
      context: .
      dockerfile: services/node/Dockerfile
    command: [contracts]
    restart: unless-stopped
    depends_on: &needs-redis
      redis:
        condition: service_healthy
    environment:
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      CONTRACTS_ORIGIN: ${CONTRACTS_ORIGIN:?Required}
      CONTRACTS_SIGNING_PRIVATE_JWK: ${CONTRACTS_SIGNING_PRIVATE_JWK:?Required}
      CONTRACTS_SIGNING_PUBLIC_JWK: ${CONTRACTS_SIGNING_PUBLIC_JWK:?Required}
      CONTRACTS_SIGNING_KID: ${CONTRACTS_SIGNING_KID:?Required}
      REDIS_URL: *redis-url
    expose: ["3001"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  crm:
    build: *node-build
    command: [crm]
    restart: unless-stopped
    depends_on: *needs-redis
    environment:
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      CRM_ORIGIN: ${CRM_ORIGIN:?Required}
      CRM_SIGNING_PRIVATE_JWK: ${CRM_SIGNING_PRIVATE_JWK:?Required}
      CRM_SIGNING_PUBLIC_JWK: ${CRM_SIGNING_PUBLIC_JWK:?Required}
      CRM_SIGNING_KID: ${CRM_SIGNING_KID:?Required}
      REDIS_URL: *redis-url
    expose: ["8000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  tickets:
    build: *node-build
    command: [tickets]
    restart: unless-stopped
    depends_on: *needs-redis
    environment:
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      TICKETS_ORIGIN: ${TICKETS_ORIGIN:?Required}
      TICKETS_SIGNING_PRIVATE_JWK: ${TICKETS_SIGNING_PRIVATE_JWK:?Required}
      TICKETS_SIGNING_PUBLIC_JWK: ${TICKETS_SIGNING_PUBLIC_JWK:?Required}
      TICKETS_SIGNING_KID: ${TICKETS_SIGNING_KID:?Required}
      REDIS_URL: *redis-url
    expose: ["3003"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  wiki:
    build: *node-build
    command: [wiki]
    restart: unless-stopped
    depends_on: *needs-redis
    environment:
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      WIKI_ORIGIN: ${WIKI_ORIGIN:?Required}
      WIKI_SIGNING_PRIVATE_JWK: ${WIKI_SIGNING_PRIVATE_JWK:?Required}
      WIKI_SIGNING_PUBLIC_JWK: ${WIKI_SIGNING_PUBLIC_JWK:?Required}
      WIKI_SIGNING_KID: ${WIKI_SIGNING_KID:?Required}
      REDIS_URL: *redis-url
    expose: ["3004"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Python resource server; also the Token-authenticated group provider.
  mail:
    build:
      context: .
      dockerfile: services/mail/Dockerfile
    restart: unless-stopped
    depends_on: *needs-redis
    environment:
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      MAIL_ORIGIN: ${MAIL_ORIGIN:?Required}
      MAIL_SIGNING_PRIVATE_JWK: ${MAIL_SIGNING_PRIVATE_JWK:?Required}
      MAIL_SIGNING_PUBLIC_JWK: ${MAIL_SIGNING_PUBLIC_JWK:?Required}
      MAIL_SIGNING_KID: ${MAIL_SIGNING_KID:?Required}
      DEMO_GROUP_PROVIDER_TOKEN: ${DEMO_GROUP_PROVIDER_TOKEN:?Required}
      REDIS_URL: *redis-url
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  bootstrap:
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
      additional_contexts:
        weldall-source: *weldall-source
    restart: "no"
    depends_on:
      weldall:
        condition: service_healthy
      contracts:
        condition: service_healthy
      crm:
        condition: service_healthy
      tickets:
        condition: service_healthy
      wiki:
        condition: service_healthy
      mail:
        condition: service_healthy
    environment:
      POSTGRES_URL: *database-url
      WELDALL_ISSUER: ${WELDALL_ISSUER:?Required}
      CONTRACTS_ORIGIN: ${CONTRACTS_ORIGIN:?Required}
      CRM_ORIGIN: ${CRM_ORIGIN:?Required}
      TICKETS_ORIGIN: ${TICKETS_ORIGIN:?Required}
      WIKI_ORIGIN: ${WIKI_ORIGIN:?Required}
      MAIL_ORIGIN: ${MAIL_ORIGIN:?Required}
      DEMO_GROUP_PROVIDER_TOKEN: ${DEMO_GROUP_PROVIDER_TOKEN:?Required}
      WELDALL_CREDENTIAL_ENCRYPTION_KEY: ${WELDALL_CREDENTIAL_ENCRYPTION_KEY:?Required}

volumes:
  postgres-data:
  redis-data:
